[project]
name = "v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi[standard]>=0.136.1",
    # 工作流
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    # 数据库 ORM + 异步驱动
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    # 向量类型支持
    "pgvector>=0.3.0",
    # 认证
    "bcrypt>=4.3.0",
    "python-jose[cryptography]>=3.4.0",
    # 工具
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.14.1",
    "pypinyin>=0.55.0",
    "python-docx>=1.2.0",
    "pypdf>=6.12.2",
    "httpx>=0.28.0",
    "aiofiles>=25.1.0",
    "gunicorn>=26.0.0",
    "pyjwt>=2.13.0",
    # 日志
    "loguru>=0.7.0",
    "rapidocr-onnxruntime>=1.4.4",
    "pypdfium2>=5.9.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[alembic]
script_location = alembic
file_template = %%(version_num)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40

# Intentionally empty: env.py reads the URL from DATABASE_URL.
# Keep this file ASCII-only -- configparser reads it with the system locale
# encoding (GBK on zh-CN Windows), so non-ASCII comments break `alembic`.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[pytest]
# 文件和函数发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_file = logs/pytest.log
log_file_level = DEBUG

# 异步配置
asyncio_mode = auto
# 每个测试用独立的 function-scope event loop
# 避免 session-scope loop 与 SQLAlchemy greenlet 机制冲突（MissingGreenlet 错误）
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# 覆盖率配置（可选，手动运行时启用）
addopts =
    -v
    --tb=short
    --strict-markers

# 测试路径
testpaths = tests

# 标记定义
markers =
    asyncio: 异步测试
    high_priority: 高优先级（P0）
    integration: 集成测试
    e2e: 端到端测试
    slow: 耗时测试
    unit: 单元测试
    no_db: 不需要数据库的测试

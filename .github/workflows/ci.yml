name: CI

on:
  push:
    branches: [main, master, fix/**]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production-123456
          DATABASE_URL: postgresql+asyncpg://workpilot:ci@127.0.0.1:5432/workpilot_ci
        run: uv run pytest tests/unit -q --tb=line

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

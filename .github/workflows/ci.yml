name: CI

on:
  push:
    branches: [main, master, fix/**]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production-123456
          DATABASE_URL: postgresql+asyncpg://workpilot:ci@127.0.0.1:5432/workpilot_ci
        run: uv run pytest tests/unit -q --tb=line

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workpilot
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: workpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpilot -d workpilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Enable pgvector + run integration tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production-123456
          DATABASE_URL: postgresql+asyncpg://workpilot:ci@127.0.0.1:5432/workpilot_ci
          TEST_DATABASE_URL: postgresql+asyncpg://workpilot:ci@127.0.0.1:5432/workpilot_ci
        run: |
          uv run pytest tests/integration/test_doc_lifecycle_authz.py tests/integration/test_documents.py tests/integration/test_users.py tests/integration/test_departments.py -q --tb=line

      - name: Retrieval-layer eval gate (fixture embeddings)
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production-123456
          DATABASE_URL: postgresql+asyncpg://workpilot:ci@127.0.0.1:5432/workpilot_ci
          TEST_DATABASE_URL: postgresql+asyncpg://workpilot:ci@127.0.0.1:5432/workpilot_ci
        run: |
          if [ -f eval/fixtures/query_embeddings.json ]; then
            uv run python scripts/experiments/run_retrieval_eval_ci.py
          else
            echo "::warning::eval/fixtures/query_embeddings.json missing — run build_eval_fixtures.py with Ollama and commit"
            if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
              echo "::error::main 分支必须提交检索 fixture，否则 P6 门控无效"
              exit 1
            fi
          fi

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

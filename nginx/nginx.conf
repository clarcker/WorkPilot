# WorkPilot v2 — Nginx 反向代理配置
#
# 关键约束（来自 系统架构.md）：
#   1. 所有 /api/*/stream 路径必须关闭 proxy_buffering（保障 SSE 实时性）
#   2. proxy_read_timeout 设为 300s（RAG 生成可能较慢）
#   3. 仅 Nginx 端口对外暴露；postgres/backend/ollama 均不对宿主机暴露

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip 压缩（不压缩 SSE 流）
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_disable    "msie6";

    # 后端 upstream
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 请求大小限制（文档上传）
        client_max_body_size 210m;

        # ── 1. SSE / 流式接口 ──────────────────────────────────────
        # 匹配所有 /api/*/stream 路径
        # 必须 proxy_buffering off，否则 SSE 事件会被 Nginx 缓冲后批量发送
        location ~ ^/api/.+/stream {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # 关闭缓冲 —— SSE 核心配置
            proxy_buffering    off;
            proxy_cache        off;

            # 保持长连接
            proxy_set_header   Connection        '';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 超时：RAG 生成最长 300 秒
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 允许分块传输
            chunked_transfer_encoding on;

            # 禁用 Nginx 的 X-Accel-Buffering 响应头检测（交由应用层控制）
            proxy_ignore_headers X-Accel-Buffering;
        }

        # ── 2. 普通 API 接口 ───────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        '';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── 3. FastAPI 文档（开发用，生产可关闭）──────────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass       http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── 4. 健康检查直通 ────────────────────────────────────────
        location /health {
            proxy_pass       http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── 5. 前端 SPA 静态文件 ───────────────────────────────────
        # Phase 6 构建完成后，React 产物会挂载到 /usr/share/nginx/html
        location / {
            root       /usr/share/nginx/html;
            index      index.html;
            # 支持 React Router 的 history 模式（404 回退到 index.html）
            try_files  $uri $uri/ /index.html;
            expires    1h;
            add_header Cache-Control "public, no-transform";
        }
    }
}
